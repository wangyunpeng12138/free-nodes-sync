# 订阅 27.txt -> Clash
# 节点数量: 2
# 源: https://github.com/Hidashimora/free-vpn-anti-rkn
# 由 src/txt2clash.py 自动生成，请勿手动编辑
# 客户端: mihomo / Clash.Meta / Clash Verge Rev / ClashX Meta（原生 Clash 不支持 vless）
mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: "127.0.0.1:9090"
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  listen: "0.0.0.0:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - localhost.ptlogin2.qq.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  proxy-server-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
proxies:
  - name: node
    type: vmess
    server: getnet.serversubasli.top
    port: 8080
    uuid: d2b67e48-c341-47ba-8caa-5658df693ac4
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: getnet.serversubasli.top
    client-fingerprint: chrome
    alpn:
      - http/1.1
    skip-cert-verify: true
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: getnet.serversubasli.top
  - name: "node 2"
    type: vmess
    server: getnet.serversubasli.top
    port: 8080
    uuid: d2b67e48-c341-47ba-8caa-5658df693ac4
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    client-fingerprint: chrome
    alpn:
      - http/1.1
    network: ws
    ws-opts:
      path: "/"
      headers:
        Host: getnet.serversubasli.top
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - DIRECT
      - node
      - "node 2"
  - name: "♻️ 自动选择"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - node
      - "node 2"
rules:
  - "GEOIP,LAN,DIRECT,no-resolve"
  - "GEOIP,CN,DIRECT"
  - "MATCH,🚀 节点选择"
